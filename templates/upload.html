{% extends "base.html" %}
{% block title %}Upload Resource | Study Portal{% endblock %}
{% block content %}
<section class="form-page">
<div class="form-card">
  <span class="eyebrow">SHARE KNOWLEDGE</span><h1>📤 Upload a Resource</h1><p>Add a useful PDF for your classmates.</p>
  <form method="POST" enctype="multipart/form-data" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Resource Title<input name="title" maxlength="120" placeholder="e.g. Data Structures Unit 1 Notes" required></label>
    <label>Subject<input name="subject" maxlength="100" placeholder="Subject name" required></label>
    <div class="form-grid">
      <label>Branch<select name="branch" required><option value="">Select branch</option>{% for b in branches %}<option>{{ b }}</option>{% endfor %}</select></label>
      <label>Semester<select name="semester" required><option value="">Select semester</option>{% for i in range(1,9) %}<option value="{{ i }}">Semester {{ i }}</option>{% endfor %}</select></label>
    </div>
    <label>Resource Type<select name="resource_type" required><option value="">Select type</option>{% for t in resource_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}</select></label>
    <label>PDF File<input type="file" name="pdf" accept="application/pdf,.pdf" required><small>PDF only · Maximum 10 MB</small></label>
    <button class="btn primary full" type="submit">Upload Resource</button>
  </form>
</div>
</section>
{% endblock %}
